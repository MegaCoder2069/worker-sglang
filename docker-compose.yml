services:
  sglang-worker:
    image: runpod/worker-sglang:dev
    pull_policy: never

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    shm_size: 32g
    ipc: host

    environment:
      - HOST=0.0.0.0
      - PORT=30000
      - SGLANG_PRESET=deepseek-v4-flash-fp8
      - DEEPSEEK_V4_HARDWARE=h200
      - DEEPSEEK_V4_RECIPE=balanced
      - MODEL_NAME=sgl-project/DeepSeek-V4-Flash-FP8
      - SERVED_MODEL_NAME=deepseek-ai/DeepSeek-V4-Flash
      - CONTEXT_LENGTH=400000
      - TRUST_REMOTE_CODE=true
      - TOOL_CALL_PARSER=deepseekv4
      - REASONING_PARSER=deepseek-v4
      - HF_TOKEN=${HF_TOKEN}

    ports:
      - "30000:30000"

    volumes:
      - ../var/runpod-volume:/runpod-volume
